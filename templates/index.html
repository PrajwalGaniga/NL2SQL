<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NL to SQL | Database Query Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#a855f7',
                        surface: '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen selection:bg-primary selection:text-white">

    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[30%] -left-[10%] w-[70%] h-[70%] rounded-full bg-primary/10 blur-[120px]"></div>
        <div class="absolute top-[20%] -right-[20%] w-[60%] h-[60%] rounded-full bg-secondary/10 blur-[120px]"></div>
    </div>

    <main class="relative z-10 container mx-auto px-4 py-12 max-w-6xl">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-bold mb-4 tracking-tight">NL to <span class="gradient-text">SQL</span></h1>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">Ask questions in natural language and the Gemini AI will convert them to precise PostgreSQL queries executed against the student database.</p>
        </header>

        <section class="glass-panel rounded-2xl p-6 md:p-8 mb-8 shadow-2xl">
            <form id="queryForm" class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="queryInput" required placeholder="e.g. Show me all students with CGPA greater than 9.0" 
                           class="w-full pl-12 pr-4 py-4 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-lg placeholder-slate-500 shadow-inner">
                </div>
                <button type="submit" id="submitBtn" class="px-8 py-4 bg-gradient-to-r from-primary to-secondary hover:from-indigo-500 hover:to-purple-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-primary/30 flex items-center justify-center gap-2 group">
                    <span>Execute</span>
                    <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </button>
            </form>
            
            <div class="mt-4 flex flex-wrap gap-2 text-sm text-slate-400">
                <span class="mr-2 text-slate-500">Try:</span>
                <button class="suggestion-btn hover:text-primary transition-colors cursor-pointer bg-slate-800/50 px-3 py-1 rounded-full border border-slate-700">List all active courses</button>
                <button class="suggestion-btn hover:text-primary transition-colors cursor-pointer bg-slate-800/50 px-3 py-1 rounded-full border border-slate-700">How many female students are there?</button>
                <button class="suggestion-btn hover:text-primary transition-colors cursor-pointer bg-slate-800/50 px-3 py-1 rounded-full border border-slate-700">Show students in Bangalore</button>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loadingIndicator" class="hidden flex-col items-center justify-center py-12">
            <div class="w-12 h-12 border-4 border-slate-700 border-t-primary rounded-full animate-spin mb-4"></div>
            <p class="text-slate-400 animate-pulse">Gemini is translating and executing...</p>
        </div>

        <!-- Error State -->
        <div id="errorMessage" class="hidden glass-panel border-red-500/30 bg-red-500/10 rounded-2xl p-6 mb-8 text-red-200">
            <div class="flex items-start gap-3">
                <svg class="w-6 h-6 text-red-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <div>
                    <h3 class="font-semibold text-red-300 text-lg mb-1">Execution Failed</h3>
                    <p id="errorText" class="opacity-90"></p>
                    <div id="errorSqlContainer" class="hidden mt-3 p-3 bg-slate-900 rounded-lg border border-red-500/20 text-red-300/80 font-mono text-sm overflow-x-auto"></div>
                </div>
            </div>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="hidden opacity-0 transition-opacity duration-500 ease-in-out">
            <!-- Generated SQL -->
            <div class="glass-panel rounded-2xl p-6 mb-8 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-semibold text-lg flex items-center gap-2">
                        <svg class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        Generated SQL
                    </h3>
                    <span class="text-xs font-mono bg-primary/20 text-primary px-2 py-1 rounded-md">gemini-2.5-flash</span>
                </div>
                <div class="bg-slate-900 rounded-xl p-4 border border-slate-700/50 overflow-x-auto">
                    <code id="sqlCode" class="font-mono text-slate-300 whitespace-pre"></code>
                </div>
            </div>

            <!-- Data Table -->
            <div class="glass-panel rounded-2xl p-6 shadow-xl overflow-hidden">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="font-semibold text-lg flex items-center gap-2">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        Query Results
                    </h3>
                    <span id="rowCount" class="bg-slate-800 text-slate-300 px-3 py-1 rounded-full text-sm font-medium border border-slate-700">0 rows</span>
                </div>
                
                <div class="overflow-x-auto border border-slate-700/50 rounded-xl bg-slate-900/50">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-400 uppercase bg-slate-800 border-b border-slate-700" id="tableHead">
                            <!-- Table headers will be injected here -->
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-800">
                            <!-- Table rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('queryForm');
            const input = document.getElementById('queryInput');
            const submitBtn = document.getElementById('submitBtn');
            const suggestions = document.querySelectorAll('.suggestion-btn');
            
            const loadingIndicator = document.getElementById('loadingIndicator');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const errorSqlContainer = document.getElementById('errorSqlContainer');
            
            const resultsContainer = document.getElementById('resultsContainer');
            const sqlCode = document.getElementById('sqlCode');
            const rowCount = document.getElementById('rowCount');
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');

            // Handle suggestion clicks
            suggestions.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    input.value = e.target.textContent;
                    form.dispatchEvent(new Event('submit'));
                });
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const query = input.value.trim();
                if (!query) return;

                // UI states
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70');
                
                loadingIndicator.classList.remove('hidden');
                loadingIndicator.classList.add('flex');
                
                errorMessage.classList.add('hidden');
                resultsContainer.classList.add('hidden');
                resultsContainer.classList.remove('opacity-100');

                try {
                    const response = await fetch('/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Render successful results
                        sqlCode.textContent = data.sql_query;
                        rowCount.textContent = `${data.row_count} row${data.row_count !== 1 ? 's' : ''}`;
                        
                        // Render headers
                        let headHtml = '<tr>';
                        data.columns.forEach(col => {
                            headHtml += `<th scope="col" class="px-6 py-4 font-semibold tracking-wider">${col}</th>`;
                        });
                        headHtml += '</tr>';
                        tableHead.innerHTML = headHtml;
                        
                        // Render rows
                        let bodyHtml = '';
                        if (data.data.length === 0) {
                            bodyHtml = `<tr><td colspan="${data.columns.length}" class="px-6 py-8 text-center text-slate-500">No results found</td></tr>`;
                        } else {
                            data.data.forEach(row => {
                                bodyHtml += '<tr class="hover:bg-slate-800/80 transition-colors">';
                                data.columns.forEach(col => {
                                    bodyHtml += `<td class="px-6 py-4 whitespace-nowrap text-slate-300">${row[col] !== null ? row[col] : '<span class="text-slate-600 italic">null</span>'}</td>`;
                                });
                                bodyHtml += '</tr>';
                            });
                        }
                        tableBody.innerHTML = bodyHtml;
                        
                        // Show results with animation
                        resultsContainer.classList.remove('hidden');
                        setTimeout(() => resultsContainer.classList.add('opacity-100'), 50);
                    } else {
                        // Show error
                        errorText.textContent = data.error || 'An unknown error occurred.';
                        if (data.sql_query) {
                            errorSqlContainer.textContent = data.sql_query;
                            errorSqlContainer.classList.remove('hidden');
                        } else {
                            errorSqlContainer.classList.add('hidden');
                        }
                        errorMessage.classList.remove('hidden');
                    }
                } catch (err) {
                    errorText.textContent = `Network or server error: ${err.message}`;
                    errorSqlContainer.classList.add('hidden');
                    errorMessage.classList.remove('hidden');
                } finally {
                    // Reset loading state
                    loadingIndicator.classList.add('hidden');
                    loadingIndicator.classList.remove('flex');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-70');
                }
            });
        });
    </script>
</body>
</html>
